[flake8]
max-line-length = 100
exclude = .git,__pycache__,migrations,venv,.venv
extend-ignore = E203,W503

[isort]
profile = black
line_length = 100
skip = migrations

[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
ignore_missing_imports = True
exclude = migrations

[mypy.plugins.django-stubs]
django_settings_module = config.settings.dev
